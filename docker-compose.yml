# Own-server deployment: app + Caddy (automatic HTTPS via Let's Encrypt).
# Usage: cp .env.example .env  → fill keys and DOMAIN → docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["3000"]          # not published: only Caddy can reach it

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. trend.example.com or 203-0-113-7.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
